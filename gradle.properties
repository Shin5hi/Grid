# Project-wide Gradle settings for Discord Bot Maker (Grid)
# Docs: https://docs.gradle.org/current/userguide/build_environment.html

# JVM heap for the Gradle daemon. 2 GB is comfortable for an AGP + Compose build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build each module in parallel and reuse the daemon between builds.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by all Jetpack / Compose dependencies.
android.useAndroidX=true

# Generate R classes containing only the resources declared in each module.
android.nonTransitiveRClass=true

# Kotlin official code style.
kotlin.code.style=official

# Package only the resources declared in each module's default configuration.
# (The AGP 8 DSL equivalent of the removed
#  android.defaults.buildfeatures.buildconfig flag; BuildConfig is disabled
#  per-module in app/build.gradle.kts.)

# ─── Toolchain (machine-specific) ────────────────────────────────────────────
# El JAVA_HOME del sistema apuntaba a un JDK 17 que ya no existe en disco y los
# unicos runtimes instalados son Java 25 (incompatibles con Gradle 8.14 / AGP
# 8.7.3). Se fija aqui un JDK 17 portable instalado en E:\Herramientas para que
# el build sea reproducible sin depender del JAVA_HOME global de la maquina.
org.gradle.java.home=E:\\Herramientas\\jdk-17.0.20.1+1

